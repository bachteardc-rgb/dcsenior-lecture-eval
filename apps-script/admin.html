<html lang="ko">
<head>
  <meta charset="UTF-8">

  <style>

    .pstate .dot2.on { background: var(--ok); box-shadow: 0 0 0 3px #dcf0e4; }
    .pstate .dot2.off { background: var(--bad); box-shadow: 0 0 0 3px #fae3e1; }

    }
    .period-edit {

      flex-wrap: wrap; align-items: flex-end;

    .period-edit input[type="date"] {

    .fgroup { display: flex; flex-direction: column; gap: 0.25rem; }

    .tabs { display: flex; gap: 0.3rem; margin: 1rem 0 0; flex-wrap: wrap; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.8rem; }
    .kpi { background: var(--navy-50); border: 1px solid var(--navy-100); border-radius: 12px; padding: 0.9rem 1rem; }
    .kpi.alt { background: #fdf4ec; border-color: #f3d9c2; }
    .kpi .k { font-size: 0.8rem; color: var(--muted); font-weight: 700; }

    h3.sec {

    .barrow { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.55rem; }

    /* 보고서용 세로형 표 */
    table.report td.l { vertical-align: middle; }

    /* 교차표 */
    .tabcap { font-weight: 700; color: var(--navy); margin: 0 0 0.5rem; font-size: 0.95rem; }
    table.cross th { font-size: 0.82rem; padding: 0.4rem 0.3rem; }

    @media (max-width: 720px) {

<body>

<!-- ===== 로그인 ===== -->
<div id="loginView" class="login">
  <div class="card">
    <h2>강의평가 관리자</h2>
    <p class="sub" id="loginSub"></p>
    <div class="q" data-key="pw" style="margin-top:1.2rem">
      <div class="label"><span>관리자 비밀번호</span></div>
      <input type="password" id="pw" placeholder="비밀번호 입력">
      <div class="errmsg" id="pwErr">비밀번호가 올바르지 않습니다.</div>
    </div>
    <button class="btn" id="btnLogin" style="width:100%;margin-top:1.1rem">로그인</button>
  </div>
</div>

<!-- ===== 대시보드 ===== -->
<div id="appView" class="hidden">
  <div class="ahead">
    <div class="in">
      <h1 id="hTitle">강의평가 결과</h1>
      <div class="meta" id="hMeta"></div>
      <div class="sp"></div>
      <button class="btn-sm" id="btnSheet">구글시트 열기</button>
      <button class="btn-sm solid" id="btnXlsx">엑셀 집계표 다운로드</button>
    </div>
  </div>

  <div class="adm">
    <div class="period" id="periodBar">
      <div class="pstate" id="pState">확인 중…</div>
      <div class="sp"></div>
      <button class="btn-line" id="btnPeriodToggle">기간 설정</button>
    </div>

    <div class="period-edit hidden" id="periodEdit">
      <div class="fgroup">
        <label for="pFrom">시작일</label>
        <input type="date" id="pFrom">
      </div>
      <div class="fgroup">
        <label for="pTo">종료일</label>
        <input type="date" id="pTo">
      </div>
      <div class="fgroup">
        <label for="pMode">상태</label>
        <select id="pMode">
          <option value="auto">기간대로 자동</option>
          <option value="open">지금 열기 (기간 무시)</option>
          <option value="closed">지금 닫기 (기간 무시)</option>
        </select>
      </div>
      <button class="btn" id="btnPeriodSave" style="min-height:2.6rem;flex:0 0 auto;padding:0 1.4rem;font-size:0.95rem">저장</button>
      <div class="phelp">
        종료일 <b>당일 밤 12시까지</b> 접수합니다. 날짜를 비우면 그 방향은 제한하지 않습니다.<br>
        마감된 뒤에는 어르신 화면에 안내만 뜨고 <b>새 응답도 수정도 되지 않습니다.</b>
        결과 화면은 마감과 무관하게 언제든 보실 수 있습니다.
      </div>
    </div>

    <div class="filters">
      <div class="fgroup">
        <label for="fRound">평가차수</label>
        <select id="fRound"></select>
      </div>
      <div class="fgroup">
        <label for="fDay">요일</label>
        <select id="fDay"><option value="">전체</option></select>
      </div>
      <div class="fgroup">
        <label for="fProg">프로그램</label>
        <select id="fProg"><option value="">전체</option></select>
      </div>
      <button class="btn" id="btnApply" style="min-height:2.6rem;flex:0 0 auto;padding:0 1.4rem;font-size:0.95rem">조회</button>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel"><div class="empty">불러오는 중…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var CFG = <?!= cfg ?>;
var TOKEN = null;
var S = null;
var TAB = 'summary';
var FILTER = { round: CFG.round, programCode: '', day: '' };

function $(id) { return document.getElementById(id); }
function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e; }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function n1(v) { return (v === null || v === undefined || v === '') ? '-' : v; }

/* 보고서 표 순서: 매우 불만족 → 매우 만족 */
var SCALE_ASC = CFG.scale.slice().sort(function (a, b) { return a.v - b.v; });

/** 4.22(.807) 형태 */
function meanSd(mean, sd) {
  var s = Number(sd).toFixed(3);
  if (s.indexOf('0.') === 0) s = s.slice(1);
  return Number(mean).toFixed(2) + '(' + s + ')';
}

/** 있음=1 / 없음=0 기준 평균(표준편차). 0.87(.341) 형태 */
function yesNoMeanSd(x) {
  function trim0(v) {
    var s = Number(v).toFixed(3);
    return s.indexOf('0.') === 0 ? s.slice(1) : s;
  }
  return trim0(x.mean) + '(' + trim0(x.sd) + ')';
}
function unitTag(u) {
  return u === '평가'
    ? '<span class="unit ev">평가건수</span>'
    : '<span class="unit pe">응답자</span>';
}
var tt;
function toast(m) {
  var t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('show'); }, 3200);
}
function overlay(m) {
  if ($('ovl')) return;
  var o = el('div', 'overlay'); o.id = 'ovl';
  o.appendChild(el('div', 'spin')); o.appendChild(el('div', '', esc(m)));
  document.body.appendChild(o);
}
function overlayOff() { var o = $('ovl'); if (o) o.remove(); }

/* ================= 로그인 ================= */
$('loginSub').textContent = CFG.centerName + ' · ' + CFG.fullTitle;

function doLogin() {
  var pw = $('pw').value;
  if (!pw) { $('pw').focus(); return; }
  $('btnLogin').disabled = true;
  google.script.run
    .withSuccessHandler(function (r) {
      $('btnLogin').disabled = false;
      if (!r.ok) {
        document.querySelector('.q[data-key="pw"]').classList.add('invalid');
        $('pwErr').textContent = r.message;
        return;
      }
      TOKEN = r.token;
      $('loginView').classList.add('hidden');
      $('appView').classList.remove('hidden');
      initApp();
    })
    .withFailureHandler(function () {
      $('btnLogin').disabled = false;
      toast('로그인 중 오류가 발생했습니다.');
    })
    .adminLogin(pw);
}
$('btnLogin').addEventListener('click', doLogin);
$('pw').addEventListener('keydown', function (e) {
  document.querySelector('.q[data-key="pw"]').classList.remove('invalid');
  if (e.key === 'Enter') doLogin();
});

/* ================= 초기화 ================= */
var TABS = [
  { id: 'summary',  name: '요약' },
  { id: 'items',    name: '문항별 통계' },
  { id: 'programs', name: '프로그램별' },
  { id: 'comments', name: '주관식 의견' },
  { id: 'wishes',   name: '희망강좌 · 키워드' }
];

function initApp() {
  var tabs = $('tabs');
  tabs.innerHTML = '';
  TABS.forEach(function (t) {
    var b = el('button', 'tab', esc(t.name));
    b.type = 'button';
    b.setAttribute('aria-selected', String(t.id === TAB));
    b.addEventListener('click', function () {
      TAB = t.id;
      Array.prototype.forEach.call(tabs.children, function (x, i) {
        x.setAttribute('aria-selected', String(TABS[i].id === TAB));
      });
      draw();
    });
    tabs.appendChild(b);
  });

  google.script.run
    .withSuccessHandler(function (o) {
      var r = $('fRound'); r.innerHTML = '';
      o.rounds.forEach(function (x) {
        var op = el('option', '', esc(x)); op.value = x;
        if (x === o.currentRound) op.selected = true;
        r.appendChild(op);
      });
      var d = $('fDay');
      o.days.forEach(function (x) {
        var op = el('option', '', esc(x + '요일')); op.value = x; d.appendChild(op);
      });
      var p = $('fProg');
      o.programs.forEach(function (x) {
        var op = el('option', '', esc(x.name + ' (' + x.day + ' ' + x.time + ')'));
        op.value = x.code; p.appendChild(op);
      });
      loadPeriod();
      loadStats();
    })
    .withFailureHandler(function (e) { toast(String(e.message || e)); })
    .getFilterOptions(TOKEN);
}

$('btnApply').addEventListener('click', function () {
  FILTER = { round: $('fRound').value, day: $('fDay').value, programCode: $('fProg').value };
  loadStats();
});

/* ================= 평가 기간 ================= */

var MODE_LABEL = {
  auto: '기간대로 자동', open: '지금 열기 (기간 무시)', closed: '지금 닫기 (기간 무시)'
};

function paintPeriod(p) {
  var when = (p.from || p.to)
    ? (p.from || '제한 없음') + ' ~ ' + (p.to || '제한 없음')
    : '기간 미설정 (계속 접수)';

  $('pState').innerHTML =

function draw() {
  if (!S) return;
  $('hMeta').textContent = S.meta.round + ' · 응답자 ' + S.meta.respondentN +
    '명 / 평가 ' + S.meta.evalN + '건 · ' + S.meta.generatedAt + ' 기준';

    p.appendChild(el('div', 'empty', '해당 조건에 응답이 없습니다.'));

     comments: drawComments, wishes: drawWishes })[TAB](p);

      '<th rowspan="2">평균</th><th rowspan="2">표준<br>편차</th></tr>';
    var h2 = '<tr>' + SCALE_ASC.map(function () {
      return '<th class="sub">빈도</th><th class="sub">%</th>';
    }).join('') + '</tr>';

    function cells(r) {
      return SCALE_ASC.map(function (sc) {
        return '<td class="num">' + r.freq[sc.v] + '</td>' +
               '<td class="num muted">' + r.pct[sc.v] + '</td>';
      }).join('');
    }

    var body = ct.rows.map(function (r) {
      return '<tr><td class="l">' + esc(r.name) +
        (r.lowN ? ' <span class="warnmark" title="평가 ' + S.meta.minN + '건 미만">⚠</span>' : '') +
        '</td>' + cells(r) +
        '<td class="num">' + r.n + '</td>' +
        '<td class="num">' + n1(r.responseRate) + '</td>' +
        '<td class="num"><b>' + r.mean + '</b></td>' +
        '<td class="num">' + r.sd + '</td></tr>';
    }).join('');

    var tot = ct.total;
    body += '<tr class="sum"><td class="l"><b>전체</b></td>' + cells(tot) +
      '<td class="num"><b>' + tot.n + '</b></td><td class="num">-</td>' +
      '<td class="num"><b>' + tot.mean + '</b></td>' +
      '<td class="num">' + tot.sd + '</td></tr>';

    holder.appendChild(el('div', 'tabcap', '&lt;' + esc(ct.id) + '&gt; ' + esc(ct.text)));

    // 전체 행은 표 맨 아래에 있지만, 위에서도 바로 보이도록 요약 띠를 둡니다
    var strip = el('div', 'totalstrip');
    strip.innerHTML =
      '<b>전체</b>' +
      SCALE_ASC.map(function (sc) {
        return '<span><i>' + esc(sc.label) + '</i>' +
               tot.freq[sc.v] + '명 (' + tot.pct[sc.v] + '%)</span>';
      }).join('') +
      '<span class="emph"><i>응답수</i>' + tot.n + '명</span>' +
      '<span class="emph"><i>평균</i>' + tot.mean + '</span>' +
      '<span class="emph"><i>표준편차</i>' + tot.sd + '</span>';
    holder.appendChild(strip);

    var tt2 = el('table', 'cross');
    tt2.innerHTML = '<thead>' + h1 + h2 + '</thead><tbody>' + body + '</tbody>';
    holder.appendChild(el('div', 'scroll')).appendChild(tt2);
  }

  sel.addEventListener('change', drawCross);
  drawCross();
}

function drawComments(p) {
  /* ---- 같은 뜻의 의견 묶음 ---- */
  p.appendChild(el('h3', 'sec', '같은 의견 묶음 · 빈도'));
  p.appendChild(el('div', 'note',
    '같은 뜻의 의견을 묶어 건수를 셉니다. 예) "수업시간이 더 길었으면 좋겠음" + "수업연장" → 2건<br>' +
    '<b>과목이 다르면 절대 같은 묶음이 되지 않습니다.</b> ' +
    '묶음을 누르면 원문을 모두 볼 수 있으니 반드시 확인하고 쓰세요. ' +
    '분류 기준은 Config.gs 의 OPINION_RULES 에서 고칠 수 있습니다.'));

  if (!S.opinions || !S.opinions.length) {
    p.appendChild(el('div', 'empty', '묶을 의견이 없습니다.'));
  } else {
    var only2 = el('label', 'chk');
    only2.innerHTML = '<input type="checkbox" id="chkMulti"> 2건 이상만 보기';
    p.appendChild(only2);

    var list2 = el('div');
    p.appendChild(list2);

    function drawGroups() {
      var multi = document.getElementById('chkMulti').checked;
      var gs = S.opinions.filter(function (g) { return !multi || g.count >= 2; });
      list2.innerHTML = '';
      if (!gs.length) { list2.appendChild(el('div', 'empty', '해당하는 묶음이 없습니다.')); return; }

      list2.appendChild(el('div', 'note', '총 ' + gs.length + '개 묶음'));
      gs.forEach(function (g) {
        var box = el('div', 'grp' + (g.count >= 2 ? ' hot' : ''));
        var head = el('div', 'grphead');
        head.innerHTML =
          '<span class="cnt">' + g.count + '건</span>' +
          '<b>' + esc(g.programName) + '</b>' +
          '<span class="lab">' + esc(g.label) + '</span>' +
          '<span class="muted">· ' + esc(g.method) + ' · ' + esc(g.qids.join(', ')) + '</span>';
        box.appendChild(head);

        var texts = el('div', 'grptexts');
        g.entries.forEach(function (e) {
          texts.appendChild(el('div', 'one',
            '<span class="who">' + esc(e.name || '(이름없음)') + '</span>' + esc(e.text)));
        });
        box.appendChild(texts);

        head.addEventListener('click', function () { box.classList.toggle('open'); });
        if (g.count >= 2) box.classList.add('open');
        list2.appendChild(box);
      });
    }
    only2.querySelector('input').addEventListener('change', drawGroups);
    drawGroups();
  }

  /* ---- 원문 전체 ---- */
  p.appendChild(el('h3', 'sec', '주관식 의견 원문'));
  p.appendChild(el('div', 'note',
    '과목별 의견(Q5·Q7·Q9)은 해당 과목에, 기관 전체 의견(Q13·Q14)은 「(기관 전체)」로 표시됩니다.'));

  p.appendChild(el('div', 'callout',
    '⚠ 아래 의견에는 <b>작성자 성함·연락처</b>가 함께 표시됩니다. ' +
    '엑셀로 내보내 강사나 외부 기관에 전달하실 때는 <b>성함·연락처 열(주황색)을 반드시 삭제</b>하고 주세요.'));

  var progs = {}, tags = {}, labels = [], names = {};
  S.comments.forEach(function (c) {
    progs[c.programName] = true;
    if (c.name) names[c.name] = true;
    c.tags.forEach(function (t) { tags[t] = true; });
    if (labels.indexOf(c.label) === -1) labels.push(c.label);
  });

  var bar = el('div', 'filters');
  bar.style.margin = '0 0 1rem';

  function sel(label, opts, onChange) {
    var g = el('div', 'fgroup');
    g.appendChild(el('label', '', esc(label)));
    var s = el('select');
    var all = el('option', '', '전체');
    all.value = '';
    s.appendChild(all);
    opts.forEach(function (o) { var op = el('option', '', esc(o)); op.value = o; s.appendChild(op); });
    s.addEventListener('change', onChange);
    g.appendChild(s);
    bar.appendChild(g);
    return s;
  }

  var qsel = sel('문항', labels, redraw);
  var psel = sel('프로그램', Object.keys(progs).sort(), redraw);
  var nsel = sel('작성자', Object.keys(names).sort(), redraw);
  var tsel = sel('키워드', Object.keys(tags).sort(), redraw);

  p.appendChild(bar);
  var list = el('div');
  p.appendChild(list);

  function redraw() {
    var f = S.comments.filter(function (c) {
      if (qsel.value && c.label !== qsel.value) return false;
      if (psel.value && c.programName !== psel.value) return false;
      if (nsel.value && c.name !== nsel.value) return false;
      if (tsel.value && c.tags.indexOf(tsel.value) === -1) return false;
      return true;
    });
    list.innerHTML = '';
    if (!f.length) { list.appendChild(el('div', 'empty', '해당 조건의 의견이 없습니다.')); return; }

    list.appendChild(el('div', 'note', '총 ' + f.length + '건'));
    f.forEach(function (c) {
      var e = el('div', 'cmt' + (c.unit === '응답자' ? ' common' : ''));
      e.appendChild(el('div', 'h',
        '<span class="who">' + esc(c.name || '(이름없음)') + '</span>' +
        (c.phone ? '<span class="phone">' + esc(c.phone) + '</span>' : '') +
        '<b>' + esc(c.programName) + '</b>' +
        (c.teacher ? ' <span>· ' + esc(c.teacher) + '</span>' : '') +
        ' <span>· ' + esc(c.label) + '</span>' +
        (c.date ? ' <span>· ' + esc(c.date) + '</span>' : '') +
        (c.tags.length ? ' ' + c.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') : '')));
      e.appendChild(el('div', 't', esc(c.text)));
      list.appendChild(e);
    });
  }
  redraw();
}

function drawWishes(p) {
  p.appendChild(el('h3', 'sec', '신규 개설 희망 강좌'));
  p.appendChild(el('div', 'note',
    '응답자 기준(1인 1표)입니다. 표기가 다른 유사 응답(요가 / 요가교실 / 요가반)은 하나로 묶어 집계합니다.'));

  if (!S.wishes.length) {
    p.appendChild(el('div', 'empty', '작성된 희망 강좌가 없습니다.'));
  } else {
    var max = S.wishes[0].count;
    S.wishes.slice(0, 30).forEach(function (w, i) {
      var r = el('div', 'barrow');
      r.appendChild(el('div', 'nm', (i + 1) + '. ' + esc(w.label)));
      var tr = el('div', 'track');
      var f = el('div', 'fill');
      f.style.width = (w.count / max * 100) + '%';
      tr.appendChild(f);
      r.appendChild(tr);
      r.appendChild(el('div', 'val', w.count + '명'));
      r.title = w.variants.join(', ');
      p.appendChild(r);
    });
  }

  p.appendChild(el('h3', 'sec', '주관식 키워드 분류'));
  p.appendChild(el('div', 'note',
    '모든 주관식 응답에서 키워드가 언급된 응답자 수입니다. 한 응답자가 여러 키워드에 중복 집계될 수 있습니다.'));
  if (!S.keywords.length) {
    p.appendChild(el('div', 'empty', '분류된 키워드가 없습니다.'));
    return;
  }
  var kmax = S.keywords[0].count;
  S.keywords.forEach(function (k) {
    var r = el('div', 'barrow');
    r.appendChild(el('div', 'nm', esc(k.tag)));
    var tr = el('div', 'track');
    var f = el('div', 'fill');
    f.style.width = (k.count / kmax * 100) + '%';
    tr.appendChild(f);
    r.appendChild(tr);
    r.appendChild(el('div', 'val', k.count + '명 (' + k.pct + '%)'));
    p.appendChild(r);
  });
}

/* ================= 내보내기 =================
   주의: 서버에 다녀온 뒤 window.open 을 부르면 브라우저가 팝업으로 보고 막습니다.
   그래서 링크를 화면에 띄우고, 사용자가 직접 누르게 합니다. */

function showLinkBox(title, url, label, note) {
  var old = $('linkbox');
  if (old) old.remove();

  var box = el('div', 'linkwrap');
  box.id = 'linkbox';

  var card = el('div', 'linkcard');
  card.appendChild(el('h3', '', esc(title)));
  if (note) card.appendChild(el('p', '', note));

  var a = el('a', 'linkgo', esc(label));
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  card.appendChild(a);

  var close = el('button', 'btn-line');
  close.type = 'button';
  close.textContent = '닫기';
  close.style.cssText = 'width:100%;margin-top:0.6rem';
  close.addEventListener('click', function () { box.remove(); });
  card.appendChild(close);

  box.appendChild(card);
  box.addEventListener('click', function (ev) { if (ev.target === box) box.remove(); });
  document.body.appendChild(box);
}

$('btnXlsx').addEventListener('click', function () {
  overlay('집계표를 만드는 중입니다…');
  $('btnXlsx').disabled = true;
  google.script.run
    .withSuccessHandler(function (r) {
      overlayOff();
      $('btnXlsx').disabled = false;
      if (!r || !r.ok) { toast('집계표 생성에 실패했습니다.'); return; }
      showLinkBox('집계표를 새로 만들었습니다', r.xlsxUrl, '엑셀 파일 내려받기',
        '기준 시각: <b>' + esc(r.generatedAt) + '</b><br>' +
        '아래를 누르면 <b>.xlsx</b> 파일이 내려받아집니다.<br>' +
        '스프레드시트의 집계표 시트도 함께 갱신되었습니다.');
    })
    .withFailureHandler(function (e) {
      overlayOff();
      $('btnXlsx').disabled = false;
      toast(String(e.message || e));
    })
    .prepareExport(TOKEN, FILTER);
});

$('btnSheet').addEventListener('click', function () {
  $('btnSheet').disabled = true;
  google.script.run
    .withSuccessHandler(function (u) {
      $('btnSheet').disabled = false;
      showLinkBox('구글시트 열기', u, '스프레드시트 열기',
        '응답 원자료와 집계표가 들어 있는 파일입니다.');
    })
    .withFailureHandler(function (e) {
      $('btnSheet').disabled = false;
      toast(String(e.message || e));
    })
    .getSpreadsheetUrl(TOKEN);
});
