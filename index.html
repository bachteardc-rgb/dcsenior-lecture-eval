<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <style>
  :root {
    --navy: #1f3864;
    --navy-700: #2f5597;
    --navy-100: #dae3f3;
    --navy-50: #eef2fa;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #15223b;
    --muted: #5b6983;
    --line: #d4dbe8;
    --ok: #1b7a46;
    --warn: #b2540d;
    --bad: #b3261e;
    --radius: 14px;
    --base: 19px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { font-size: var(--base); }
  html[data-fs="2"] { --base: 22px; }
  html[data-fs="3"] { --base: 26px; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo",
                 "Noto Sans KR", system-ui, sans-serif;
    font-size: 1rem;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 620px; margin: 0 auto; padding: 0 0 0.5rem; }

  /* ---------- 상단 바 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--navy); color: #fff;
    padding: 0.7rem 0.9rem 0.6rem;
  }
  .topbar-inner { max-width: 620px; margin: 0 auto; }
  .topbar h1 { margin: 0; font-size: 1.05rem; font-weight: 700; line-height: 1.35; }
  .topbar .round { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }

  .fsbar { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .fsbar span { font-size: 0.78rem; opacity: 0.85; margin-right: 2px; }
  .fsbtn {
    background: rgba(255,255,255,0.14); color: #fff;
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 8px; padding: 3px 11px; cursor: pointer;
    font-family: inherit; line-height: 1.2;
  }
  .fsbtn[aria-pressed="true"] { background: #fff; color: var(--navy); font-weight: 700; }
  .fsbtn.s1 { font-size: 0.8rem; }
  .fsbtn.s2 { font-size: 0.95rem; }
  .fsbtn.s3 { font-size: 1.15rem; }

  /* ---------- 진행 표시 ---------- */
  .progress { background: #c9d4e8; height: 8px; }
  .progress > i { display: block; height: 100%; background: var(--navy-700); width: 0; transition: width .25s ease; }
  .stepinfo {
    max-width: 620px; margin: 0 auto; padding: 0.5rem 0.9rem 0;
    font-size: 0.85rem; color: var(--muted); font-weight: 600;
  }

  /* ---------- 카드 ---------- */
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); margin: 0.9rem 0.7rem;
    padding: 1.1rem 1rem; box-shadow: 0 1px 3px rgba(20,35,70,0.06);
  }
  .card h2 {
    margin: 0 0 0.2rem; font-size: 1.15rem; color: var(--navy);
    border-left: 5px solid var(--navy-700); padding-left: 0.55rem; line-height: 1.4;
  }
  .card .sub { color: var(--muted); font-size: 0.88rem; margin: 0.35rem 0 0; }

  .notice {
    background: var(--navy-50); border: 1px solid var(--navy-100);
    border-radius: 10px; padding: 0.85rem 0.9rem; font-size: 0.93rem; line-height: 1.65;
  }
  .notice b { color: var(--navy); }
  .notice ul { margin: 0.5rem 0 0; padding-left: 1.1rem; }
  .notice li { margin-bottom: 0.25rem; }

  /* ---------- 질문 ---------- */
  .q { margin-top: 1.5rem; }
  .q:first-of-type { margin-top: 0.9rem; }
  .q > .label {
    font-weight: 700; font-size: 1.04rem; line-height: 1.5;
    display: flex; gap: 0.45rem; align-items: baseline;
  }
  .q > .label .num {
    flex: none; min-width: 1.9rem; height: 1.9rem;
    background: var(--navy-700); color: #fff; border-radius: 50%;
    font-size: 0.82rem; display: inline-flex; align-items: center;
    justify-content: center; font-weight: 700;
  }
  .q .hint { color: var(--warn); font-size: 0.86rem; margin: 0.3rem 0 0 2.35rem; }
  .req { color: var(--bad); margin-left: 2px; }

  /* ---------- 입력 ---------- */
  input[type="text"], input[type="tel"], textarea, select {
    width: 100%; font-family: inherit; font-size: 1rem; color: var(--text);
    border: 2px solid var(--line); border-radius: 10px;
    padding: 0.7rem 0.75rem; background: #fff; margin-top: 0.5rem;
  }
  textarea { min-height: 6.5rem; resize: vertical; line-height: 1.6; }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--navy-700);
    box-shadow: 0 0 0 3px rgba(47,85,151,0.16);
  }

  /* ---------- 선택지 ---------- */
  .opts { display: grid; gap: 0.5rem; margin-top: 0.7rem; }
  .opts.two { grid-template-columns: 1fr 1fr; }

  .opt {
    display: flex; align-items: center; gap: 0.7rem;
    min-height: 3.1rem; padding: 0.6rem 0.85rem;
    border: 2px solid var(--line); border-radius: 12px;
    background: #fff; cursor: pointer; font-size: 1rem;
    font-family: inherit; text-align: left; width: 100%;
    color: var(--text); line-height: 1.4;
  }
  .opt .dot {
    flex: none; width: 1.35rem; height: 1.35rem; border-radius: 50%;
    border: 2px solid #9aa8c2; background: #fff; position: relative;
  }
  .opt[aria-pressed="true"] {
    border-color: var(--navy-700); background: var(--navy-50); font-weight: 700;
  }
  .opt[aria-pressed="true"] .dot { border-color: var(--navy-700); }
  .opt[aria-pressed="true"] .dot::after {
    content: ""; position: absolute; inset: 3px;
    border-radius: 50%; background: var(--navy-700);
  }
  .opt .meta { color: var(--muted); font-size: 0.84rem; font-weight: 400; }
  .opt .tagok, .opt .tagredo {
    display: inline-block; border-radius: 6px; padding: 0.05rem 0.4rem;
    font-size: 0.75rem; font-weight: 700; margin-left: 0.2rem; white-space: nowrap;
  }
  .opt .tagok { background: #dcf0e4; color: var(--ok); }
  .opt .tagredo { background: #fdeadd; color: var(--warn); }

  .q.invalid > .label { color: var(--bad); }
  .q.invalid .opts .opt, .q.invalid input, .q.invalid textarea { border-color: #e8a7a2; }
  .errmsg { color: var(--bad); font-size: 0.88rem; margin-top: 0.4rem; font-weight: 600; display: none; }
  .q.invalid .errmsg { display: block; }

  /* ---------- 프로그램 선택 ---------- */
  .daygroup { margin-top: 1.1rem; }
  .daygroup > h3 {
    margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--navy);
    background: var(--navy-100); border-radius: 8px;
    padding: 0.3rem 0.65rem; display: inline-block;
  }

  /* ---------- 하단 버튼 ----------
     화면에 고정하지 않습니다. 문항을 모두 지나 아래로 내려와야 보입니다. */
  .navbar {
    background: #fff; border-top: 2px solid var(--navy-100);
    padding: 1.1rem 0.7rem calc(2.2rem + env(safe-area-inset-bottom));
    margin-top: 0.6rem;
  }
  .navbar-inner { max-width: 620px; margin: 0 auto; display: flex; gap: 0.6rem; }
  .btn {
    flex: 1; min-height: 3.3rem; border-radius: 12px; border: 2px solid var(--navy-700);
    font-family: inherit; font-size: 1.05rem; font-weight: 700; cursor: pointer;
    background: var(--navy-700); color: #fff; line-height: 1.3;
  }
  .btn.ghost { background: #fff; color: var(--navy-700); }
  .btn.wide { flex: 2; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn:active { transform: translateY(1px); }

  /* ---------- 확인 / 완료 ---------- */
  .review { border-top: 1px solid var(--line); }
  .review dl { margin: 0; }
  .review .row {
    display: flex; gap: 0.7rem; padding: 0.55rem 0;
    border-bottom: 1px dashed var(--line); font-size: 0.95rem;
  }
  .review .row dt { flex: none; width: 42%; color: var(--muted); margin: 0; }
  .review .row dd { margin: 0; font-weight: 600; flex: 1; }

  .done { text-align: center; padding: 2.2rem 1rem; }
  .done .check {
    width: 4.5rem; height: 4.5rem; border-radius: 50%; margin: 0 auto 1rem;
    background: var(--ok); color: #fff; font-size: 2.3rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .done .check.warn { background: var(--warn); }
  .done h2 { border: 0; padding: 0; font-size: 1.35rem; }

  .hidden { display: none !important; }

  .toast {
    position: fixed; left: 50%; bottom: 1.6rem; transform: translateX(-50%);
    background: #15223b; color: #fff; padding: 0.7rem 1.1rem; border-radius: 10px;
    font-size: 0.95rem; z-index: 60; max-width: 90vw; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 0.96; }

  .overlay {
    position: fixed; inset: 0; background: rgba(244,246,251,0.9);
    display: flex; align-items: center; justify-content: center;
    z-index: 80; flex-direction: column; gap: 0.9rem; font-weight: 700; color: var(--navy);
  }
  .spin {
    width: 2.6rem; height: 2.6rem; border-radius: 50%;
    border: 4px solid var(--navy-100); border-top-color: var(--navy-700);
    animation: sp 0.8s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <h1 id="ttl">사회교육프로그램 강의평가</h1>
    <div class="round" id="rnd"></div>
    <div class="fsbar">
      <span>글자 크기</span>
      <button class="fsbtn s1" data-fs="1" aria-pressed="true">가</button>
      <button class="fsbtn s2" data-fs="2" aria-pressed="false">가</button>
      <button class="fsbtn s3" data-fs="3" aria-pressed="false">가</button>
    </div>
  </div>
</div>

<div class="progress"><i id="bar"></i></div>
<div class="stepinfo" id="stepinfo"></div>

<div class="wrap" id="wrap"></div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btnPrev">이전</button>
    <button class="btn wide" id="btnNext">다음</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================================================================
 * Apps Script 와 통신하는 부분  (build.mjs 가 자동으로 넣은 코드)
 *
 * 이 화면은 Vercel에 올라가 있어서 google.script.run 을 쓸 수 없습니다.
 * 대신 아래에서 같은 이름·같은 사용법의 껍데기를 만들어 둡니다.
 * 덕분에 화면 코드(아래 전부)는 Apps Script에 있을 때와 글자 하나 다르지 않습니다.
 * =================================================================== */

var API_URL = "https://script.google.com/macros/s/AKfycbxTU8J8kGory1nEaHXpofimw6apAMXNQFhrPD8yET-e7ImTqhwz7P55da-2OkKoFGxmeg/exec";
var CFG = null;

/* POST 의 Content-Type 이 text/plain 인 것은 실수가 아닙니다.
   application/json 으로 보내면 브라우저가 사전확인(OPTIONS)을 먼저 보내는데
   Apps Script 는 그 요청을 처리하지 못해 무조건 실패합니다. */
function apiPost(action, args) {
  return apiFetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, args: args })
  });
}

function apiGet(action) {
  return apiFetch(API_URL + '?action=' + encodeURIComponent(action), { method: 'GET' });
}

/* 20초 안에 답이 없거나 통신이 끊기면 한 번만 다시 시도합니다.
   네 가지 저장 요청은 모두 같은 요청을 두 번 보내도 덧쓰기만 되므로
   (응답자ID + 과목코드 기준) 중복 저장될 걱정이 없습니다. */
function apiFetch(url, opts, isRetry) {
  var ctl = ('AbortController' in window) ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);
  if (ctl) opts.signal = ctl.signal;

  return fetch(url, opts)
    .then(function (res) { return res.text(); })
    .then(function (text) {
      clearTimeout(timer);
      try {
        return JSON.parse(text);
      } catch (e) {
        throw new Error('서버가 올바른 응답을 주지 않았습니다.');
      }
    })
    .catch(function (err) {
      clearTimeout(timer);
      if (isRetry) throw err;
      return apiFetch(url, opts, true);
    });
}

/* google.script.run 과 똑같이 쓸 수 있는 껍데기.
   .withSuccessHandler(...).withFailureHandler(...).startSession(...) 형태 그대로. */
var google = window.google || {};
google.script = google.script || {};
(function () {
  var METHODS = ['startSession', 'setSelection', 'saveProgramEval', 'saveCommon'];

  function runner(onOk, onFail) {
    var o = {
      withSuccessHandler: function (f) { return runner(f, onFail); },
      withFailureHandler: function (f) { return runner(onOk, f); }
    };
    METHODS.forEach(function (name) {
      o[name] = function () {
        var args = Array.prototype.slice.call(arguments);
        apiPost(name, args).then(
          function (res) { if (onOk) onOk(res); },
          function (err) { if (onFail) onFail(err); }
        );
      };
    });
    return o;
  }

  google.script.run = runner(null, null);
  window.google = google;
})();

/* 응답 상태 */
var A = {
  consent: null,
  name: '',
  phone: '',        // 숫자만
  phoneView: '',    // 하이픈 포함
  rid: null,        // 응답자ID
  selected: [],     // 평가할 과목 코드
  doneCodes: [],    // 서버에 이미 저장된 과목
  redo: {},         // 다시 작성할 과목
  progs: {},        // progs[code] = { Q4_1.., Q5, Q6_1.., Q7, Q8_1.., Q9, Q11 }
  common: {}        // { Q10, Q12, Q13, Q14 }
};

var STEPS = [];
var step = 0;
var RETURN_TO = false;   // [수정] 으로 들어왔으면 과목 저장 후 확인 화면으로 복귀

/* ================= 유틸 ================= */
function $(id) { return document.getElementById(id); }
function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
var toastTimer;
function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2800);
}
function overlay(msg) {
  if ($('ovl')) return;
  var o = el('div', 'overlay');
  o.id = 'ovl';
  o.appendChild(el('div', 'spin'));
  o.appendChild(el('div', '', esc(msg)));
  document.body.appendChild(o);
}
function overlayOff() { var o = $('ovl'); if (o) o.remove(); }

function store(k, v) { try { localStorage.setItem('dcse_' + k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem('dcse_' + k); } catch (e) { return null; } }

/* ================= 전화번호 하이픈 ================= */
function phoneDigits(v) { return String(v || '').replace(/[^0-9]/g, '').slice(0, 11); }

/** 입력 중에는 3-4-4, 입력이 끝났을 때 10자리면 3-3-4 로 정리 */
function phoneFormat(v, finished) {
  var d = phoneDigits(v);
  if (d.length <= 3) return d;
  if (finished && d.length === 10) {
    return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
  }
  if (d.length <= 7) return d.slice(0, 3) + '-' + d.slice(3);
  return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
}

function attachPhoneFormat(inp) {
  function apply(finished) {
    var caretDigits = inp.value.slice(0, inp.selectionStart || 0).replace(/[^0-9]/g, '').length;
    var f = phoneFormat(inp.value, finished);
    inp.value = f;
    A.phone = phoneDigits(f);
    A.phoneView = f;

    // 커서를 원래 자리(숫자 기준)로 되돌립니다
    var pos = 0, cnt = 0;
    while (pos < f.length && cnt < caretDigits) {
      if (f.charCodeAt(pos) >= 48 && f.charCodeAt(pos) <= 57) cnt++;
      pos++;
    }
    try { inp.setSelectionRange(pos, pos); } catch (e) {}
  }
  inp.addEventListener('input', function () { apply(false); });
  inp.addEventListener('blur', function () { apply(true); });
}

/* ================= 글자 크기 ================= */
Array.prototype.forEach.call(document.querySelectorAll('.fsbtn'), function (b) {
  b.addEventListener('click', function () {
    document.documentElement.setAttribute('data-fs', b.getAttribute('data-fs'));
    Array.prototype.forEach.call(document.querySelectorAll('.fsbtn'), function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
    store('fs', b.getAttribute('data-fs'));
  });
});
(function () {
  var f = load('fs');
  if (f) {
    var tb = document.querySelector('.fsbtn[data-fs="' + f + '"]');
    if (tb) tb.click();
  }
})();

/* ================= 공통 부품 ================= */
var qno = 0;

function card(title, sub) {
  var c = el('div', 'card');
  if (title) c.appendChild(el('h2', '', esc(title)));
  if (sub) c.appendChild(el('p', 'sub', sub));
  return c;
}

function question(parent, key, labelText, hint, required) {
  qno++;
  var q = el('div', 'q');
  q.setAttribute('data-key', key);
  var lab = el('div', 'label');
  lab.innerHTML = '<span class="num">' + qno + '</span><span>' + esc(labelText) +
                  (required ? '<span class="req">*</span>' : '') + '</span>';
  q.appendChild(lab);
  if (hint) q.appendChild(el('div', 'hint', esc(hint)));
  parent.appendChild(q);
  return q;
}

/** 선택지 버튼. get/set 으로 값을 읽고 씁니다. */
function choices(q, options, get, set, cols) {
  var box = el('div', 'opts' + (cols === 2 ? ' two' : ''));
  options.forEach(function (o) {
    var b = el('button', 'opt');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(get() === o.v));
    b.innerHTML = '<span class="dot"></span><span>' + esc(o.label) + '</span>';
    b.addEventListener('click', function () {
      set(o.v);
      Array.prototype.forEach.call(box.children, function (c) {
        c.setAttribute('aria-pressed', 'false');
      });
      b.setAttribute('aria-pressed', 'true');
      q.classList.remove('invalid');
    });
    box.appendChild(b);
  });
  q.appendChild(box);
  q.appendChild(el('div', 'errmsg', '답변을 선택해 주세요.'));
  return box;
}

function textField(q, get, set, opts) {
  opts = opts || {};
  var inp = opts.multiline ? el('textarea') : el('input');
  if (!opts.multiline) inp.type = opts.type || 'text';
  inp.placeholder = opts.placeholder || '';
  inp.value = get() || '';
  if (opts.type === 'tel') {
    inp.setAttribute('inputmode', 'numeric');
    inp.setAttribute('autocomplete', 'tel');
    inp.setAttribute('maxlength', '13');
  }
  inp.addEventListener('input', function () {
    set(inp.value);
    q.classList.remove('invalid');
  });
  q.appendChild(inp);
  q.appendChild(el('div', 'errmsg', '내용을 입력해 주세요.'));
  return inp;
}

var SCALE_OPTS = [];   // CFG 가 도착한 뒤 boot() 에서 채웁니다
var YESNO = [{ v: 1, label: '있음 (O)' }, { v: 0, label: '없음 (X)' }];

function scaleLabel(v) {
  for (var i = 0; i < CFG.scale.length; i++) {
    if (CFG.scale[i].v === v) return CFG.scale[i].label;
  }
  return '-';
}
function progByCode(code) {
  for (var i = 0; i < CFG.programs.length; i++) {
    if (CFG.programs[i].code === code) return CFG.programs[i];
  }
  return null;
}
function progAnswers(code) {
  if (!A.progs[code]) A.progs[code] = {};
  return A.progs[code];
}
function isDone(code) {
  return A.doneCodes.indexOf(code) !== -1 && !A.redo[code];
}
/** 선택한 과목을 요일·시간 순으로 정렬합니다 */
function sortSelected() {
  var order = {};
  CFG.programs.forEach(function (p, i) { order[p.code] = i; });
  A.selected.sort(function (a, b) { return order[a] - order[b]; });
}

/** 실제로 평가를 진행할 과목 (이미 작성한 과목은 제외) */
function pendingCodes() {
  return A.selected.filter(function (c) { return !isDone(c); });
}

/* ================= 뒤에서 저장하기 =================
 *
 *  구글시트에 한 번 쓰는 데 2초쯤 걸립니다. 과목마다 그걸 기다리게 하면
 *  5과목이면 10초를 멍하니 보고 계셔야 합니다. 그래서 저장은 뒤로 보내고
 *  화면은 곧바로 넘깁니다.
 *
 *  대신 마지막 제출 직전에 bgSettle() 로 전부 저장됐는지 반드시 확인합니다.
 *  하나라도 실패했으면 제출을 막고 그 과목으로 되돌립니다.
 *  "저장된 줄 알았는데 안 돼 있는" 일이 생기지 않도록 하는 장치입니다.
 * =================================================== */

var BG = [];   // 아직 끝나지 않았거나 실패한 저장들

function bgSave(label, code, send) {
  var job = { label: label, code: code, done: false, failed: false, res: null };
  BG.push(job);
  send(
    function (r) {                       // 서버가 답을 준 경우
      job.done = true;
      job.res = r;
      job.failed = !r || !r.ok;
      if (job.failed) bgFailed(job);
    },
    function () {                        // 아예 연결이 안 된 경우
      job.done = true;
      job.failed = true;
      bgFailed(job);
    }
  );
  return job;
}

/** 뒤에서 보낸 저장이 실패했을 때 — 화면 상태를 사실에 맞게 되돌립니다 */
function bgFailed(job) {
  if (job.res && job.res.code === 'CLOSED') { showClosed(job.res.period); return; }

  if (job.code) {
    var i = A.doneCodes.indexOf(job.code);
    if (i !== -1) A.doneCodes.splice(i, 1);   // 작성 완료 표시를 거둬들입니다
    A.redo[job.code] = true;
  }
  toast(job.label + ' 저장에 실패했습니다. 제출 전에 다시 안내해 드립니다.');
}

/** 뒤에서 보낸 저장이 전부 끝날 때까지 기다린 뒤 실패 목록을 돌려줍니다 */
function bgSettle(cb) {
  function finish() { cb(BG.filter(function (j) { return j.failed; })); }
  if (!BG.some(function (j) { return !j.done; })) { finish(); return; }
  var t = setInterval(function () {
    if (BG.some(function (j) { return !j.done; })) return;
    clearInterval(t);
    finish();
  }, 120);
}

    onNext: function (done) {

      // 뒤에서 보낸 과목 저장이 전부 끝났는지 먼저 확인합니다.
      bgSettle(function (bad) {
        // 과목 평가가 저장되지 않았으면 제출을 막고 그 과목으로 되돌립니다.
        // (수강 과목 선택은 실패해도 평가 자체는 남으므로 제출을 막지 않습니다)
        var blocking = bad.filter(function (j) { return j.code; });

          .withSuccessHandler(function (r) {
            overlayOff();

            showDone(r.doneCount);
          })
          .withFailureHandler(function () {
            overlayOff();

            done(false);

          .saveCommon(A.rid, payload);

  return steps;

  [['성함', A.name], ['휴대폰번호', A.phoneView]].forEach(function (x) {
    var r = el('div', 'row');
    r.appendChild(el('dt', '', esc(x[0])));
    r.appendChild(el('dd', '', esc(x[1])));
    dl.appendChild(r);
  });
  var box = el('div', 'review');
  box.appendChild(dl);
  c.appendChild(box);

  c.appendChild(restartBlock());
  w.appendChild(c);
}

/**
 * [다른 분이 평가하기] 버튼 + 확인 단계.
 * 브라우저 기본 확인창(confirm)은 환경에 따라 막히므로 화면 안에서 확인받습니다.
 */
function restartBlock() {
  var ask = el('div');
  ask.style.marginTop = '1.2rem';

  var b = el('button', 'btn ghost');
  b.type = 'button';
  b.style.width = '100%';
  b.textContent = '다른 분이 평가하기';

  var confirmBox = el('div', 'notice hidden');
  confirmBox.style.marginTop = '0.8rem';
  confirmBox.innerHTML =
    '성함과 휴대폰번호부터 다시 입력합니다.<br>' +
    '<b>이미 저장된 평가는 그대로 보관되며 지워지지 않습니다.</b>';

  var yes = el('button', 'btn hidden');
  yes.type = 'button';
  yes.style.cssText = 'width:100%;margin-top:0.7rem';
  yes.textContent = '네, 다른 분이 하겠습니다';
  yes.addEventListener('click', resetAll);

  var no = el('button', 'btn ghost hidden');
  no.type = 'button';
  no.style.cssText = 'width:100%;margin-top:0.5rem';
  no.textContent = '아니요';
  no.addEventListener('click', function () {
    confirmBox.classList.add('hidden');
    yes.classList.add('hidden');
    no.classList.add('hidden');
    b.classList.remove('hidden');
  });

  b.addEventListener('click', function () {
    b.classList.add('hidden');
    confirmBox.classList.remove('hidden');
    yes.classList.remove('hidden');
    no.classList.remove('hidden');
  });

  ask.appendChild(b);
  ask.appendChild(confirmBox);
  ask.appendChild(yes);
  ask.appendChild(no);
  return ask;
}

/** 처음부터 새로 시작. 이미 저장된 평가는 서버에 그대로 남습니다. */
function resetAll() {
  A = {
    consent: null, name: '', phone: '', phoneView: '', rid: null,
    selected: [], doneCodes: [], redo: {}, progs: {}, common: {}
  };
  try {
    localStorage.removeItem('dcse_name');
    localStorage.removeItem('dcse_phone');
    localStorage.removeItem('dcse_rid');
  } catch (e) {}

  $('navbar').classList.remove('hidden');
  $('btnNext').disabled = false;
  STEPS = buildSteps();
  step = 0;
  render();
}

/* ================= 접수 마감 화면 ================= */

function periodText(p) {
  if (!p) return '';
  if (!p.from && !p.to) return '';
  return '평가 기간: ' + (p.from || '') + ' ~ ' + (p.to || '');
}

function showClosed(p) {
  $('navbar').classList.add('hidden');
  $('bar').style.width = '0';
  $('stepinfo').textContent = '';

  var w = $('wrap');
  w.innerHTML = '';
  var c = el('div', 'card done');
  c.appendChild(el('div', 'check warn', '!'));
  c.appendChild(el('h2', '',
    (p && p.state === 'before') ? '평가 기간이 아직 아닙니다' : '평가가 마감되었습니다'));

  var t = periodText(p);
  c.appendChild(el('p', 'sub',
    (t ? esc(t) + '<br>' : '') +
    '자세한 사항은 복지관으로 문의해 주세요.'));
  w.appendChild(c);
  window.scrollTo(0, 0);
}

/** 서버가 돌려준 오류를 공통 처리합니다. 마감이면 마감 화면으로 전환합니다. */
function handleServerError(r) {
  if (r && r.code === 'CLOSED') { showClosed(r.period); return; }
  toast((r && r.message) || '처리에 실패했습니다. 다시 시도해 주세요.');
}

/* ================= 과목 선택 버튼 ================= */

function progOption(p) {
  var b = el('button', 'opt');
  b.type = 'button';
  b.setAttribute('data-code', p.code);
  paintProgOption(b, p);
  b.addEventListener('click', function () {
    var i = A.selected.indexOf(p.code);
    var done = A.doneCodes.indexOf(p.code) !== -1;

    if (done) {
      // 작성 완료한 과목: 완료(건너뛰기) ↔ 다시 작성
      if (A.redo[p.code]) delete A.redo[p.code];
      else A.redo[p.code] = true;
      if (i === -1) A.selected.push(p.code);
    } else if (i === -1) {
      // CFG.maxPrograms 가 0 이면 제한 없음
      if (CFG.maxPrograms > 0 && A.selected.length >= CFG.maxPrograms) {
        toast('한 번에 ' + CFG.maxPrograms + '개까지 선택할 수 있습니다.');
        return;
      }
      A.selected.push(p.code);
    } else {
      A.selected.splice(i, 1);
    }
    sortSelected();
    paintProgOption(b, p);
    updateSelCount();
    var q = document.querySelector('.q[data-key="selected"]');
    if (q) q.classList.remove('invalid');
  });
  return b;
}

function paintProgOption(b, p) {
  var picked = A.selected.indexOf(p.code) !== -1;
  var done = A.doneCodes.indexOf(p.code) !== -1;
  var redo = !!A.redo[p.code];

  b.setAttribute('aria-pressed', String(picked));

  var badge = '';
  if (done && !redo) badge = ' <span class="tagok">작성 완료</span>';
  else if (done && redo) badge = ' <span class="tagredo">다시 작성</span>';

  // 요일별로 묶여 있으므로 항목에는 시간만 표시합니다
  b.innerHTML = '<span class="dot"></span><span>' + esc(p.name) +
                ' <span class="meta">' + esc(p.time) + '</span>' + badge + '</span>';
}

function updateSelCount() {
  var e = $('selCount');
  if (!e) return;
  var pend = pendingCodes().length;
  if (!A.selected.length) {
    e.innerHTML = '아직 선택하지 않으셨습니다.';
    return;
  }
  var names = A.selected.map(function (c) { return progByCode(c).name; }).join(', ');
  e.innerHTML = '<b>' + A.selected.length + '개 과목</b>을 선택하셨습니다.<br>' +
                '<span style="font-size:.9em">' + esc(names) + '</span>' +
                (pend !== A.selected.length
                  ? '<br><span style="font-size:.88em">이번에 평가할 과목: <b>' + pend + '개</b></span>'
                  : '');
}

/* ================= 화면 전환 ================= */

function rebuild() {
  var cur = STEPS[step];
  STEPS = buildSteps();
  // 현재 단계 이름 기준으로 위치 유지 (과목 선택 단계에서만 호출됨)
  if (cur) {
    for (var i = 0; i < STEPS.length; i++) {
      if (STEPS[i].name === cur.name) { step = i; break; }
    }
  }
}

function render() {
  qno = 0;
  var w = $('wrap');
  w.innerHTML = '';
  STEPS[step].render(w);

  $('bar').style.width = Math.round(step / (STEPS.length - 1) * 100) + '%';
  $('stepinfo').textContent = STEPS[step].isLast
    ? '마지막 단계  ·  ' + STEPS[step].name
    : (step + 1) + ' / ' + STEPS.length + '  ·  ' + STEPS[step].name;

  $('btnPrev').classList.toggle('hidden', step === 0);
  $('btnNext').textContent = STEPS[step].isLast ? '제출 완료하기' : '다음';
  window.scrollTo(0, 0);
}

function focusInvalid(key) {
  var q = document.querySelector('.q[data-key="' + key + '"]');
  if (!q) return;
  q.classList.add('invalid');
  q.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/** [수정] — 해당 과목의 첫 평가 단계로 이동하고, 끝나면 확인 화면으로 돌아옵니다 */
function jumpToProgram(code) {
  A.redo[code] = true;
  STEPS = buildSteps();
  for (var i = 0; i < STEPS.length; i++) {
    if (STEPS[i].progCode === code) {
      step = i;
      RETURN_TO = true;
      render();
      return;
    }
  }
  render();
}

/** 공통 문항 단계로 이동했다가 확인 화면으로 돌아옵니다 */
function jumpToCommon() {
  for (var i = 0; i < STEPS.length; i++) {
    if (STEPS[i].isCommon) {
      step = i;
      RETURN_TO = true;
      render();
      return;
    }
  }
}

function advance() {
  var st = STEPS[step];
  var finishedEdit = !!st.progCode || !!st.isCommon;   // 과목은 한 페이지라 저장되면 끝

  // [수정]으로 들어왔다가 다 고쳤으면 확인 화면으로 되돌아갑니다
  if (RETURN_TO && finishedEdit) {
    RETURN_TO = false;
    STEPS = buildSteps();
    step = STEPS.length - 1;
    render();
    return;
  }
  if (step < STEPS.length - 1) { step++; render(); }
}

$('btnPrev').addEventListener('click', function () {
  if (step > 0) { step--; render(); }
});

$('btnNext').addEventListener('click', function () {
  var st = STEPS[step];
  var v = st.validate();
  if (v !== true) { focusInvalid(v); return; }

  $('btnNext').disabled = true;
  function finish(ok) {
    $('btnNext').disabled = false;
    if (ok) advance();
  }

  if (st.onNext) st.onNext(finish);
  else finish(true);
});

/* ================= 완료 ================= */

function showDone(doneCount) {
  $('bar').style.width = '100%';
  $('stepinfo').textContent = '제출 완료';
  $('navbar').classList.add('hidden');
  $('btnNext').disabled = false;   // 제출 시 잠근 버튼을 반드시 풀어줍니다

  var w = $('wrap');
  w.innerHTML = '';
  var c = el('div', 'card done');
  c.appendChild(el('div', 'check', '✓'));
  c.appendChild(el('h2', '', '제출이 완료되었습니다'));
  c.appendChild(el('p', 'sub',
    '<b>' + (doneCount || A.selected.length) + '개 과목</b>의 평가를 작성해 주셨습니다.<br>' +
    '소중한 의견 감사합니다.<br>더 좋은 프로그램으로 보답하겠습니다.'));

  c.appendChild(el('p', 'sub',
    '<b>' + esc(A.name) + '</b> 님으로 작성되었습니다.'));

  var b = el('button', 'btn');
  b.type = 'button';
  b.style.cssText = 'width:100%;margin-top:1.4rem';
  b.textContent = '과목 추가로 평가하기';
  b.addEventListener('click', function () {
    A.redo = {};
    A.progs = {};
    // A.common 은 그대로 두어 공통 문항이 미리 채워진 상태로 보이게 합니다
    $('navbar').classList.remove('hidden');
    $('btnNext').disabled = false;
    STEPS = buildSteps();
    step = 2;
    render();
  });
  c.appendChild(b);

  // 다음 분에게 넘길 때
  c.appendChild(restartBlock());

  w.appendChild(c);
  window.scrollTo(0, 0);
}

/* ================= 시작 ================= */
/* 원래는 여기서 바로 화면을 그렸지만, Vercel 에서는 문항을 먼저
   받아와야 하므로 설정이 도착한 뒤에 실행되도록 감싸 두었습니다. */

function boot() {
  SCALE_OPTS = CFG.scale.map(function (s) { return { v: s.v, label: s.label }; });

  $('ttl').textContent = CFG.surveyTitle;
  $('rnd').textContent = CFG.centerName + ' · ' + CFG.round;

  (function () {
    var n = load('name'), p = load('phone');
    if (n) A.name = n;
    if (p) { A.phoneView = p; A.phone = phoneDigits(p); }
  })();

  if (CFG.period && CFG.period.open === false) {
    showClosed(CFG.period);
  } else {
    STEPS = buildSteps();
    render();
  }
}

/* 문항·안내문구·접수기간을 Apps Script 에서 받아옵니다.
 *
 * 구글시트에서 설정을 받아오는 데 2초쯤 걸립니다. 매번 그걸 기다리면
 * 화면이 빈 채로 2초가 흐릅니다. 그래서 한 번 받은 설정을 이 기기에
 * 저장해 두고, 다음부터는 그걸로 먼저 그린 뒤 최신 설정을 뒤에서 받아옵니다.
 * 복지관 태블릿처럼 여러 분이 돌아가며 쓰는 경우에 특히 효과가 큽니다.
 */
(function () {
  var CACHE_KEY = 'dcse_cfg';
  var MAX_AGE = 6 * 60 * 60 * 1000;   // 6시간이 지난 설정은 쓰지 않습니다

  var cached = null;
  try {
    var raw = localStorage.getItem(CACHE_KEY);
    if (raw) {
      var o = JSON.parse(raw);
      if (o && o.at && (Date.now() - o.at) < MAX_AGE && o.data) cached = o.data;
    }
  } catch (e) {}

  if (cached) { CFG = cached; boot(); }
  else { $('ttl').textContent = '불러오는 중입니다...'; }

  apiGet('config').then(function (res) {
    if (!res || !res.ok || !res.data) throw new Error((res && res.message) || '설정을 받지 못했습니다.');
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), data: res.data }));
    } catch (e) {}

    if (!cached) { CFG = res.data; boot(); return; }

    // 저장해 둔 설정으로 이미 그린 뒤입니다. 달라진 것이 있으면 맞춰줍니다.
    var changed = JSON.stringify(res.data) !== JSON.stringify(cached);
    CFG = res.data;
    if (CFG.period && CFG.period.open === false) { showClosed(CFG.period); return; }
    if (changed && step === 0) {   // 아직 시작 전일 때만 다시 그립니다
      SCALE_OPTS = CFG.scale.map(function (s) { return { v: s.v, label: s.label }; });
      STEPS = buildSteps();
      render();
    }
  }).catch(function () {
    if (cached) return;   // 저장해 둔 설정으로 이미 진행 중이면 그대로 둡니다
    $('ttl').textContent = '사회교육프로그램 강의평가';
    $('wrap').innerHTML =
      '<div class="card">' +
      '<h2>잠시 연결이 되지 않습니다</h2>' +
      '<p>인터넷 연결을 확인하신 뒤 화면을 새로고침해 주세요.</p>' +
      '<p>계속 같은 화면이 나오면 복지관 사무실로 알려주시기 바랍니다.</p>' +
      '</div>';
    $('navbar').style.display = 'none';
  });
})();
</script>
